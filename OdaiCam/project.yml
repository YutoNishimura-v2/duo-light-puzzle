name: OdaiCam
options:
  bundleIdPrefix: io.github.yutonishimura-v2
  # 外側の画面に出す CameraCaptureAccessory は iOS 27.1 から
  deploymentTarget:
    iOS: "27.1"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # 署名なしでビルドし、SideStore が無料 Apple ID で署名する
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  OdaiCam:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
      # 試験用の偽カメラの動画（CI の UI テストでだけ置く。リポジトリには入れない）
      - path: TestAssets
        optional: true
        buildPhase: resources
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yutonishimura-v2.odaicam
        PRODUCT_NAME: OdaiCam
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        # SideStore（0.7.0-alpha）は表示名を App ID の名前に使い、Apple は ASCII 以外を断る。日本語名は ja.lproj の訳で出す
        CFBundleDisplayName: OdaiCam
        CFBundleLocalizations: [en, ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 背面カメラで、お題を演じる人を撮るために使います。
        NSMicrophoneUsageDescription: ハイライト動画に、遊んでいるときの声や笑い声を残すために使います。
        NSSpeechRecognitionUsageDescription: 当てる人が声に出した答えを端末の中で聞き取り、お題と合っているかを判定します。
        NSPhotoLibraryAddUsageDescription: ハイライト動画を写真ライブラリに保存します。
        ITSAppUsesNonExemptEncryption: false
  # シミュレータで偽カメラを使ってひととおり遊ぶ UI テスト（odaicam-shots ワークフローで動かす）
  OdaiCamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: OdaiCam
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yutonishimura-v2.odaicam.uitests
        TEST_TARGET_NAME: OdaiCam
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  OdaiCamUITests:
    build:
      targets:
        OdaiCam: all
        OdaiCamUITests: [test]
    test:
      config: Debug
      targets:
        - OdaiCamUITests
