name: odaicam-shots

# シミュレータで各画面を開いて画面写真を撮る（見た目の確認用。配布はしない）
# あわせて、偽カメラ（動画）を使ってひととおり遊ぶ UI テストを動かす。テストが落ちたらこのワークフローも落ちる
on:
  push:
    branches: [main]
    paths:
      - "OdaiCam/**"
      - ".github/workflows/odaicam-shots.yml"
  workflow_dispatch:

concurrency:
  group: odaicam-shots
  cancel-in-progress: true

jobs:
  shots:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: OdaiCam
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app
          brew install xcodegen
          xcrun simctl list devices available

      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build -quiet \
            -project OdaiCam.xcodeproj -scheme OdaiCam \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual

      - name: Screenshots
        run: |
          set -euo pipefail
          # Duo があればそれ、なければ最新の Pro
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          devs = [x for k, v in d.items() if "iOS" in k for x in v]
          pick = [x for x in devs if "Duo" in x["name"]] or [x for x in devs if "Pro" in x["name"] and "Max" not in x["name"]] or devs
          print(pick[-1]["udid"]); print(pick[-1]["name"], file=sys.stderr)')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time 9:41 || true
          # シミュレータの Duo は閉じた状態で起動し、アプリは外側の画面に出る（内側は黒のまま。開く命令は simctl にない）
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/OdaiCam.app
          mkdir -p shots
          for s in welcome home play countdown results settings decks howto; do
            xcrun simctl launch --terminate-running-process "$UDID" io.github.yutonishimura-v2.odaicam -shot "$s"
            sleep 6
            # Duo は画面が 2 つ（内側と外側）。両方撮る
            xcrun simctl io "$UDID" screenshot --display=3 "shots/$s-inner.png" || xcrun simctl io "$UDID" screenshot "shots/$s-inner.png"
            xcrun simctl io "$UDID" screenshot --display=1 "shots/$s-outer.png" || true
          done
          ls -la shots

      - uses: actions/upload-artifact@v4
        with:
          name: odaicam-shots
          path: OdaiCam/shots

  uitest:
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: OdaiCam
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.1.app
          brew install xcodegen

      - name: Sample clip
        # 偽カメラに流す人の動画。The Grizzly Bear Dance (1913)、パブリックドメイン（Wikimedia Commons）。
        # 取れなければアプリが描く人形で代わりにする（テストは続ける）
        run: |
          set -uo pipefail
          mkdir -p TestAssets
          SRC="$RUNNER_TEMP/src.webm"
          if curl -fsSL --retry 3 -A "OdaiCamCI/1.0 (https://github.com/YutoNishimura-v2)" -o "$SRC" \
               "https://upload.wikimedia.org/wikipedia/commons/5/55/The_Grizzly_Bear_Dance_%281913%29.webm" \
             && (command -v ffmpeg || brew install ffmpeg) > /dev/null; then
            # 真ん中を縦長に切り出し、10 秒・30 コマ/秒・音なし
            ffmpeg -y -loglevel error -ss 14 -t 10 -i "$SRC" \
              -vf "crop=ih*9/16:ih,scale=540:960,fps=30,format=yuv420p" -an -c:v libx264 -crf 28 \
              TestAssets/fake-camera.mp4 || rm -f TestAssets/fake-camera.mp4
          fi
          ls -la TestAssets

      - name: Boot simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          devs = [x for k, v in d.items() if "iOS" in k for x in v]
          pick = [x for x in devs if "Duo" in x["name"]] or [x for x in devs if "Pro" in x["name"] and "Max" not in x["name"]] or devs
          print(pick[-1]["udid"]); print(pick[-1]["name"], file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark

      - name: Build for testing
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build-for-testing -quiet \
            -project OdaiCam.xcodeproj -scheme OdaiCamUITests \
            -configuration Debug -destination "id=$UDID" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual

      - name: UI test
        run: |
          set -uo pipefail
          mkdir -p uitest
          # 外側の画面（アプリが出る方）を録画しておく
          xcrun simctl io "$UDID" recordVideo --display=1 --codec=h264 --force uitest/run.mp4 &
          REC=$!
          sleep 2
          xcodebuild test-without-building \
            -project OdaiCam.xcodeproj -scheme OdaiCamUITests \
            -destination "id=$UDID" -derivedDataPath build \
            -resultBundlePath uitest/Result.xcresult > uitest/xcodebuild.log 2>&1
          STATUS=$?
          grep -E "Test (Case|Suite)|error:|XCTAssert|failed|passed" uitest/xcodebuild.log || tail -50 uitest/xcodebuild.log
          kill -INT $REC || true
          wait $REC || true
          # 録画はそのままだと 500 MB ほどあるので、小さくしてから上げる
          if command -v ffmpeg > /dev/null; then
            ffmpeg -y -loglevel error -i uitest/run.mp4 -vf "scale=540:-2,fps=15" -c:v libx264 -crf 32 -an uitest/run-small.mp4               && mv uitest/run-small.mp4 uitest/run.mp4
          else
            avconvert --preset Preset960x540 --source uitest/run.mp4 --output uitest/run-small.mp4 --replace               && mv uitest/run-small.mp4 uitest/run.mp4
          fi
          ls -la uitest/run.mp4
          echo "xcodebuild exit $STATUS"
          echo "STATUS=$STATUS" >> "$GITHUB_ENV"

      - name: Summary
        if: always()
        run: |
          set -uo pipefail
          R=uitest/Result.xcresult
          if [ -d "$R" ]; then
            xcrun xcresulttool get test-results summary --path "$R" > uitest/summary.json || true
            python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          try:
              s = json.load(open("uitest/summary.json"))
          except Exception as e:
              print("summary なし:", e); raise SystemExit
          print(f"## OdaiCam UI テスト: {s.get('result')}")
          print(f"成功 {s.get('passedTests')} / 失敗 {s.get('failedTests')} / 飛ばし {s.get('skippedTests')}  ({s.get('finishTime', 0) - s.get('startTime', 0):.0f} 秒)")
          for f in s.get("testFailures", []):
              print(f"- {f.get('testName')}: {f.get('failureText')}")
          PY
            mkdir -p uitest/raw uitest/attachments
            xcrun xcresulttool export attachments --path "$R" --output-path uitest/raw || true
            # 名前の付いた画面写真だけを、名前どおりのファイルにする
            python3 - <<'PY'
          import json, os, re, shutil
          m = json.load(open("uitest/raw/manifest.json"))
          for test in m:
              for a in test["attachments"]:
                  name = a.get("suggestedHumanReadableName", "")
                  src = os.path.join("uitest/raw", a["exportedFileName"])
                  if name.endswith(".png") and not name.startswith(("UI Snapshot", "Synthesized")):
                      shutil.copy(src, os.path.join("uitest/attachments", re.sub(r"_0_[0-9A-F-]+\.png$", ".png", name)))
                  elif name.endswith(".mp4"):
                      shutil.copy(src, os.path.join("uitest/attachments", name.replace(" ", "_")))
          print(sorted(os.listdir("uitest/attachments")))
          PY
          fi
          # 落ちたときの記録（シミュレータのクラッシュレポート）
          mkdir -p uitest/crashes
          find ~/Library/Logs/DiagnosticReports -name 'OdaiCam*' -newer project.yml -exec cp {} uitest/crashes/ \; 2>/dev/null || true
          ls uitest/crashes
          # アプリのログ（直近の分）
          xcrun simctl spawn "$UDID" log show --last 20m --style compact --predicate 'process == "OdaiCam"' > uitest/app.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: odaicam-uitest
          path: |
            OdaiCam/uitest/attachments
            OdaiCam/uitest/crashes
            OdaiCam/uitest/run.mp4
            OdaiCam/uitest/xcodebuild.log
            OdaiCam/uitest/summary.json
            OdaiCam/uitest/app.log

      - name: Result
        run: |
          echo "xcodebuild exit $STATUS"
          test "$STATUS" = 0
