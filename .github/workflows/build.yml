name: build

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "LightCore/**"
      - ".github/workflows/build.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  ios:
    uses: ./.github/workflows/ios-build.yml
    with:
      dir: App
      app: LightPuzzle
    secrets: inherit
