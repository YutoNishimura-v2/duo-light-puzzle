name: odaicam

on:
  push:
    branches: [main]
    paths:
      - "OdaiCam/**"
      - ".github/workflows/odaicam.yml"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: ios-apps に配布する（false なら IPA は成果物だけ）
        type: boolean
        default: false

concurrency:
  group: odaicam
  cancel-in-progress: false

jobs:
  ios:
    uses: ./.github/workflows/ios-build.yml
    with:
      dir: OdaiCam
      app: OdaiCam
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    secrets: inherit
